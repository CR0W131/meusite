<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>₿ Bitcoin Wallet Tracker</title>
    
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: 
                radial-gradient(circle at 20% 20%, #1f2937 0%, transparent 40%),
                radial-gradient(circle at 80% 0%, #78350f 0%, transparent 35%),
                #0b0f19;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .glass {
            background: rgba(17, 24, 39, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .fade-in {
            animation: fade 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .text-metallic-blue {
            color: #3b82f6;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
        .text-emerald-glow {
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-5xl mx-auto fade-in">
        
        <!-- HEADER -->
        <header class="flex flex-col items-center gap-4 mb-10">
            <div class="w-28 h-28 rounded-3xl glass flex items-center justify-center shadow-2xl relative">
                <span class="text-6xl font-black text-orange-400">₿</span>
                <div id="loadingIcon" class="absolute -bottom-2 -right-2 text-orange-400 hidden">
                    <i data-lucide="refresh-cw" class="animate-spin w-5 h-5"></i>
                </div>
            </div>
            <h1 class="text-3xl font-black tracking-tight">Bitcoin Wallet</h1>
            
            <div class="flex items-center gap-4 text-[10px] font-bold tracking-widest text-slate-400 uppercase glass px-4 py-2 rounded-full border-white/5">
                <div class="flex items-center gap-2 border-r border-white/10 pr-4">
                    <div id="statusDot" class="w-2 h-2 rounded-full animate-pulse bg-emerald-500"></div>
                    <span id="statusText">LIVE DATA</span>
                </div>
                <div class="flex items-center gap-2">
                    <i data-lucide="clock" class="w-3 h-3"></i>
                    <span id="lastUpdateHeader">A CARREGAR...</span>
                </div>
            </div>
        </header>

        <!-- GRID DE CARDS (2x2 no mobile, 4 colunas no desktop) -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            
            <div onclick="openModal('tx')" class="glass p-5 rounded-2xl hover:scale-[1.03] transition cursor-pointer border-l-4 border-orange-500/30">
                <div class="flex justify-between mb-3 text-slate-400 text-[10px] font-bold uppercase tracking-wider">
                    Saldo BTC <i data-lucide="wallet" class="w-3.5 h-3.5"></i>
                </div>
                <p class="text-lg sm:text-xl font-extrabold text-orange-400">0.17508990</p>
            </div>

            <div onclick="openModal('avg')" class="glass p-5 rounded-2xl hover:scale-[1.03] transition cursor-pointer border-l-4 border-blue-500/30">
                <div class="flex justify-between mb-3 text-slate-400 text-[10px] font-bold uppercase tracking-wider">
                    Valor BRL <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i>
                </div>
                <p id="valBrl" class="text-lg sm:text-xl font-black text-metallic-blue">---</p>
            </div>

            <div class="glass p-5 rounded-2xl hover:scale-[1.03] transition border-l-4 border-emerald-500/30">
                <div class="flex justify-between mb-3 text-slate-400 text-[10px] font-bold uppercase tracking-wider">
                    Valor USD <i data-lucide="dollar-sign" class="w-3.5 h-3.5"></i>
                </div>
                <p id="valUsd" class="text-lg sm:text-xl font-black text-emerald-glow">---</p>
            </div>

            <div onclick="openModal('pnl')" class="glass p-5 rounded-2xl hover:scale-[1.03] transition cursor-pointer">
                <div class="flex justify-between mb-3 text-slate-400 text-[10px] font-bold uppercase tracking-wider">
                    Resultado <i id="pnlIcon" data-lucide="activity" class="w-3.5 h-3.5"></i>
                </div>
                <p id="valPnl" class="text-lg sm:text-xl font-black">---</p>
            </div>

        </div>

        <div class="text-center mt-12 text-[10px] font-bold tracking-[0.4em] text-slate-600 uppercase">
            GTK
        </div>
    </div>

    <!-- MODAL -->
    <div id="modalOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-md p-6">
        <div class="glass rounded-3xl p-8 w-full max-w-sm fade-in shadow-2xl border border-white/10">
            <div class="flex items-center gap-3 mb-4">
                <div id="modalIconContainer" class="text-orange-400"></div>
                <h3 id="modalTitle" class="font-black text-xl"></h3>
            </div>
            <div id="modalContent" class="text-sm text-slate-300 leading-relaxed"></div>
            <button onclick="closeModal()" class="mt-6 w-full bg-orange-500 hover:bg-orange-400 active:scale-95 transition-all text-black font-black py-4 rounded-2xl shadow-lg shadow-orange-500/20">
                FECHAR
            </button>
        </div>
    </div>

    <script>
        const WALLET_BTC = 0.17508990;
        const INITIAL_INVEST = 100000.00;
        const API_URL = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,brl";

        const TRANSACTIONS = [
            { btc: 0.04104891, date: '2025-09-29' }, { btc: 0.04005861, date: '2025-09-29' },
            { btc: 0.01773225, date: '2025-09-29' }, { btc: 0.03875900, date: '2025-10-01' },
            { btc: 0.02018070, date: '2025-10-01' }, { btc: 0.00094905, date: '2025-12-15' },
            { btc: 0.00095091, date: '2025-12-15' }, { btc: 0.00085914, date: '2025-01-15' },
            { btc: 0.00095133, date: '2026-01-22' }, { btc: 0.00680000, date: '2026-02-05' },
            { btc: 0.00680000, date: '2026-02-05' }
        ];

        let currentPrices = { brl: 0, usd: 0 };

        const fBrl = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
        const fUsd = v => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(v);

        function openModal(type) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');
            const iconBox = document.getElementById('modalIconContainer');
            
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            if(type === 'tx') {
                title.innerText = "Histórico de Compras";
                iconBox.innerHTML = '<i data-lucide="history"></i>';
                let html = `<div class="mb-4 flex justify-between items-center text-xs text-slate-400"><span>Total Acumulado:</span> <span class="text-orange-400 font-bold">${WALLET_BTC} BTC</span></div>`;
                html += '<div class="space-y-2 max-h-48 overflow-y-auto custom-scroll pr-2">';
                TRANSACTIONS.forEach(tx => {
                    html += `<div class="flex justify-between text-[11px] py-2 border-b border-white/5">
                                <span class="text-slate-500">${tx.date}</span>
                                <span class="font-bold text-orange-400">${tx.btc} BTC</span>
                             </div>`;
                });
                html += '</div>';
                content.innerHTML = html;
            } else if(type === 'avg') {
                title.innerText = "Custo Médio";
                iconBox.innerHTML = '<i data-lucide="calculator"></i>';
                const avg = INITIAL_INVEST / WALLET_BTC;
                content.innerHTML = `<div class="p-4 bg-blue-500/10 rounded-2xl border border-blue-500/20 text-center"><div class="text-[10px] font-bold text-blue-400 uppercase mb-1">Seu Preço Médio</div><div class="text-xl font-black text-white">${fBrl(avg)}</div></div>`;
            } else if(type === 'pnl') {
                title.innerText = "Performance";
                iconBox.innerHTML = '<i data-lucide="activity"></i>';
                const totalValue = currentPrices.brl * WALLET_BTC;
                const pnl = totalValue - INITIAL_INVEST;
                const isProfit = pnl >= 0;
                content.innerHTML = `<div class="p-6 rounded-2xl text-center ${isProfit ? 'bg-emerald-500/10' : 'bg-rose-500/10'}"><div class="text-[10px] font-bold text-slate-500 uppercase mb-1">Lucro/Prejuízo Líquido</div><div class="text-2xl font-black ${isProfit ? 'text-emerald-400' : 'text-rose-400'}">${fBrl(pnl)}</div></div>`;
            }
            lucide.createIcons();
        }

        function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

        // Função resiliente com Exponential Backoff
        async function fetchWithRetry(url, retries = 5, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2; // Dobra o tempo de espera a cada erro
                }
            }
        }

        async function updateData() {
            const loading = document.getElementById('loadingIcon');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const headerUpdate = document.getElementById('lastUpdateHeader');
            
            loading.classList.remove('hidden');
            
            try {
                const data = await fetchWithRetry(API_URL);
                currentPrices = data.bitcoin;
                
                const totalBrl = currentPrices.brl * WALLET_BTC;
                const totalUsd = currentPrices.usd * WALLET_BTC;
                const pnl = totalBrl - INITIAL_INVEST;

                document.getElementById('valBrl').innerText = fBrl(totalBrl);
                document.getElementById('valUsd').innerText = fUsd(totalUsd);
                
                const pnlEl = document.getElementById('valPnl');
                pnlEl.innerText = fBrl(pnl);
                pnlEl.className = `text-lg sm:text-xl font-black ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
                
                document.getElementById('pnlIcon').setAttribute('data-lucide', pnl >= 0 ? 'trending-up' : 'trending-down');
                headerUpdate.innerText = new Date().toLocaleTimeString();
                
                statusDot.className = "w-2 h-2 rounded-full animate-pulse bg-emerald-500";
                statusText.innerText = "LIVE DATA";
            } catch (error) {
                console.error("Erro ao buscar preços:", error);
                headerUpdate.innerText = "RECONECTANDO...";
                statusDot.className = "w-2 h-2 rounded-full bg-red-500";
                statusText.innerText = "ERRO API";
                // Tenta novamente em 5 segundos caso falhe o ciclo de retries
                setTimeout(updateData, 5000);
            } finally {
                loading.classList.add('hidden');
                lucide.createIcons();
            }
        }

        lucide.createIcons();
        updateData();
        setInterval(updateData, 60000);
    </script>
</body>
</html>
